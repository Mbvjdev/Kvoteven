name: Desktop packages
on:
  push:
    branches: [main, 'feat/cross-platform-production']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Native package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-rust-1.98.1-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            desktop-${{ runner.os }}-rust-1.98.1-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/package-lock.json') }}-
      - name: Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libsecret-1-dev patchelf xvfb dbus-x11 gnome-keyring
      - name: Reproducible frontend install, tests and build
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Core tests and warning-free lint
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          python ../scripts/check_public_tree.py
          python -m unittest discover -s ../scripts -p 'test_*.py' -v
      - name: Real OS keyring round-trip (synthetic value only)
        if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test keyring_roundtrip native_keyring_roundtrip -- --ignored --exact
      - name: Real Linux Secret Service round-trip (synthetic value only)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -ec 'printf "%s" "synthetic-ci-keyring-unlock" | gnome-keyring-daemon --unlock --components=secrets; cargo test --manifest-path src-tauri/Cargo.toml --locked --test keyring_roundtrip native_keyring_roundtrip -- --ignored --exact'
      - name: Audit locked Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock
      - name: Browser interaction tests
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Remove private builder paths from release artifacts
        shell: bash
        run: |
          python -c 'import os; from pathlib import Path; p=Path(os.environ["GITHUB_ENV"]); p.open("a").write("RUSTFLAGS=--remap-path-prefix="+str(Path.home())+"=builder --remap-path-prefix="+str(Path.cwd().parent)+"=kvoteven\n")'
      - name: Build macOS universal candidate (ad-hoc, not notarized)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --ci
          python ../scripts/check_macos_desktop.py
      - name: Build, install and run Linux candidate
        if: runner.os == 'Linux'
        run: |
          npm run tauri -- build --bundles deb --ci
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          dbus-run-session -- xvfb-run -a python ../scripts/check_desktop.py /usr/bin/kvoteven --gui --package ./src-tauri/target/release/bundle/deb/*.deb --report ../verification/native-linux.json
      - name: Build, install and run Windows candidate (unsigned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Missing NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'kvoteven-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          python ../scripts/check_desktop.py "$destination/kvoteven.exe" --gui --package $installer.FullName --report ../verification/native-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect verified packages and SHA-256 manifest
        run: python ../scripts/collect_desktop.py
      - name: Upload only distribution artifacts and synthetic test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kvoteven-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/packages/*
            verification/native-*.json
          if-no-files-found: error
          retention-days: 14
  publish-beta:
    name: Attach verified beta packages
    needs: desktop
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download successful native package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kvoteven-*
          merge-multiple: true
          path: verified
      - name: Attach packages to the existing public beta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease' | python -c 'import sys; assert sys.stdin.read().strip() == "true", "Only public beta releases may be populated by this workflow"'
          test -d verified/dist/packages
          gh release upload "$RELEASE_TAG" verified/dist/packages/*
